name: "Build and Publish"

# Note this workflow is designed to be locked-down to prevent supply chain attacks;
# 1. GitHub actions are specified by exact hash.
# 2. Distributions are built in a seperate job to the publishing action,
#    so build time doesn't have access to the publishing token.
# 3. No caching is used to prevent cache poisoning.

on:
  push:
    branches: [ develop ]
    tags: [ '*' ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ develop ]
  schedule:
    - cron: '30 22 15 * *'

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    strategy:
      # Matrix to exercise the build backend on all versions of python supported
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pypa/build
        run: |
          pip install --group build
          python --version
          pip list

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-built-with-py${{ matrix.python }}
          path: dist/

  publish:
    name: "Publish to PyPI"
    # Only upload for an actual tag
    if: ${{ startsWith(github.ref, 'refs/tags') }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Download distributions from one job of the matrix
          name: "distributions-built-with-py3.13"
          path: "dist"

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
