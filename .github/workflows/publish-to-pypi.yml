name: "Build and Publish"

# Note this workflow is designed to be locked-down to prevent supply chain attacks;
# 1. GitHub actions are specified by exact hash.
# 2. Distributions are built in a seperate job to the publishing action,
#    so build time doesn't have access to the publishing token.
# 3. No caching is used to prevent cache poisoning.

on:
  push:
    branches: [ develop ]
    tags: [ '*' ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ develop ]
  schedule:
    - cron: '30 22 15 * *'

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    strategy:
      # Matrix to exercise the build backend on all versions of python supported
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pypa/build
        run: |
          pip install --group build
          python --version
          pip list

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-built-with-py${{ matrix.python }}
          path: dist/

  publish:
    name: "Publish to PyPI"
    # Only upload for an actual tag
    if: ${{ startsWith(github.ref, 'refs/tags') }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Download distributions from one job of the matrix
          name: "distributions-built-with-py3.12"
          path: "dist"

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
